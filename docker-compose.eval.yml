# Postgres + pgvector only, for local RAG/parser evaluation (scripts/local_pg_eval.sh).
# Separate container, port, and volume from the dev `db` service so its schema
# (embedding dimension) and data are never touched.
services:
  eval-db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rag_eval}
      - POSTGRES_USER=${POSTGRES_USER:-rag_eval}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag_eval}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - eval-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_eval} -d ${POSTGRES_DB:-rag_eval}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eval-postgres-data:
