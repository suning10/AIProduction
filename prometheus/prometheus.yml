global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['app:8000']

  # API running on the host (make dev) while Prometheus/Grafana run in Docker (Docker Desktop on macOS/Windows).
  - job_name: 'fastapi-local'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
